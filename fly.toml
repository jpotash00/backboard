# fly.toml app configuration file generated for offboard on 2026-07-09T13:40:27-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'offboard'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  OFFBOARD_CONFIG_DIR = '/data/configs'
  OFFBOARD_RUNS_DIR = '/data/runs'
  OFFBOARD_TRUSTED_PROXY_HOPS = '1'
  # Seed the bundled secret-less demo tenants (acme/zen) onto the volume on boot, so GET /demo
  # works. Idempotent + never overwrites an onboarded tenant. Remove to stop reseeding.
  OFFBOARD_SEED_DEMO = '1'
  # Where the image's top-level demo/ and configs/ dirs live (the WORKDIR). The `api` package is
  # pip-installed to site-packages, so these siblings can't be found __file__-relative on prod.
  OFFBOARD_APP_ROOT = '/app'
  PORT = '8000'

[[mounts]]
  source = 'offboard_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
