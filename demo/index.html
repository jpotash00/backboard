<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M0 14 A14 14 0 0 1 14 0 L106 0 A14 14 0 0 1 120 14 L120 44 L76 44 A16 16 0 0 0 76 76 L120 76 L120 106 A14 14 0 0 1 106 120 L14 120 A14 14 0 0 1 0 106 Z' fill='%23d97757'/%3E%3C/svg%3E" />
  <title>Offboard — demo</title>
  <style>
    /* shadcn/ui neutral (zinc) tokens — the same system the cancel widget renders in. */
    :root{
      --bg:hsl(0 0% 100%); --panel:hsl(0 0% 100%); --panel-2:hsl(240 4.8% 95.9%);
      --line:hsl(240 5.9% 90%); --ink:hsl(240 10% 3.9%); --dim:hsl(240 3.8% 46.1%);
      --accent:hsl(240 5.9% 10%); --accent-strong:hsl(240 6% 20%);
      --good:hsl(142 71% 35%); --good-soft:hsl(142 71% 35% / .12);
      --warn:hsl(35 92% 33%); --warn-soft:hsl(35 92% 45% / .14);
      --destructive:hsl(0 72% 45%);
      --on-accent:hsl(0 0% 98%);
      --ring:hsl(240 5% 34%);
      --shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 30px rgba(0,0,0,.06);
      --ease:cubic-bezier(.32,.72,0,1);
      /* Standard shadcn/ui tokens (raw HSL triples) so the cancel widget can ADOPT them via
         theme.adoptHostTokens — the widget then inherits this page's palette, light + dark. */
      --background:0 0% 100%; --foreground:240 10% 3.9%;
      --muted:240 4.8% 95.9%; --muted-foreground:240 3.8% 46.1%;
      --border:240 5.9% 90%; --ring:240 5% 34%;
      --primary:240 5.9% 10%; --primary-foreground:0 0% 98%; --radius:.65rem;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:hsl(240 10% 3.9%); --panel:hsl(240 10% 6%); --panel-2:hsl(240 3.7% 15.9%);
        --line:hsl(240 3.7% 18%); --ink:hsl(0 0% 98%); --dim:hsl(240 5% 64.9%);
        --accent:hsl(0 0% 98%); --accent-strong:hsl(0 0% 88%);
        --good:hsl(142 69% 58%); --good-soft:hsl(142 69% 58% / .14);
        --warn:hsl(35 92% 60%); --warn-soft:hsl(35 92% 55% / .16);
        --destructive:hsl(0 72% 60%);
        --on-accent:hsl(240 5.9% 10%);
        --ring:hsl(240 4.9% 64%);
        --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
        /* Dark values for the adopted shadcn tokens — the widget flips with the page. */
        --background:240 10% 6%; --foreground:0 0% 98%;
        --muted:240 3.7% 15.9%; --muted-foreground:240 5% 64.9%;
        --border:240 3.7% 18%; --ring:240 4.9% 64%;
        --primary:0 0% 98%; --primary-foreground:240 5.9% 10%;
      }
    }
    *{ box-sizing:border-box }
    body{ margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
      font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,
        "Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      letter-spacing:-.01em; }
    .wrap{ max-width:600px; margin:0 auto; padding:56px 20px 96px }

    .brand{ display:flex; align-items:center; gap:10px; margin-bottom:32px }
    .brand-mark{ width:30px; height:30px; border-radius:8px; background:var(--accent);
      color:var(--on-accent); display:grid; place-items:center }
    .brand-mark svg{ width:17px; height:17px }
    .brand-name{ font-size:15px; font-weight:600 }
    .brand-tag{ margin-left:auto; font-size:12px; color:var(--dim) }

    h1{ font-size:32px; line-height:1.1; font-weight:700; letter-spacing:-.03em; margin:0 0 8px }
    .sub{ color:var(--dim); font-size:16px; line-height:1.5; margin:0 0 32px; max-width:44ch }

    .card{ background:var(--panel); border:1px solid var(--line); border-radius:20px;
      box-shadow:var(--shadow); padding:6px 22px; margin-bottom:16px }
    .row{ display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:18px 0; border-bottom:1px solid var(--line) }
    .row:last-child{ border-bottom:0 }
    .row-label{ font-size:13px; color:var(--dim); margin-bottom:3px }
    .row-value{ font-size:16px; font-weight:600 }
    .plan-price{ font-weight:500; color:var(--dim) }

    .seg{ display:inline-flex; background:var(--panel-2); border-radius:11px; padding:3px; gap:2px }
    .seg button{ appearance:none; border:0; background:transparent; color:var(--dim);
      font:inherit; font-size:14px; font-weight:500; padding:7px 14px; border-radius:9px;
      cursor:pointer; transition:all .2s var(--ease) }
    .seg button.on{ background:var(--panel); color:var(--ink);
      box-shadow:0 1px 3px rgba(0,0,0,.12); font-weight:600 }
    @media (prefers-color-scheme: dark){ .seg button.on{ background:hsl(240 5% 26%) } }

    .field-label{ font-size:13px; color:var(--dim); display:block; margin:4px 0 8px }
    .select{ position:relative }
    select{ appearance:none; width:100%; background:var(--panel-2); color:var(--ink);
      border:1px solid var(--line); border-radius:12px; padding:12px 40px 12px 14px;
      font:inherit; font-size:15px; cursor:pointer; transition:border-color .18s ease }
    select:focus{ outline:none; border-color:var(--accent) }
    .select::after{ content:""; position:absolute; right:15px; top:50%; width:9px; height:9px;
      border-right:2px solid var(--dim); border-bottom:2px solid var(--dim);
      transform:translateY(-70%) rotate(45deg); pointer-events:none }
    .note{ display:flex; gap:8px; margin-top:12px; padding:12px 14px; border-radius:12px;
      background:var(--panel-2); color:var(--dim); font-size:13px; line-height:1.5 }
    .note-tag{ flex:0 0 auto; font-size:11px; font-weight:700; letter-spacing:.03em;
      text-transform:uppercase; color:var(--accent); padding-top:1px }

    .cancel-row{ display:flex; align-items:center; justify-content:space-between;
      padding:18px 0 20px }
    .cancel-btn{ appearance:none; border:1px solid var(--line); background:var(--panel);
      color:var(--destructive); font:inherit; font-size:15px; font-weight:600; padding:11px 20px;
      border-radius:10px; cursor:pointer; transition:all .18s ease }
    .cancel-btn:hover{ background:var(--panel-2) }
    .cancel-btn:active{ transform:scale(.98) }

    /* Result */
    #result{ opacity:0; transform:translateY(10px); transition:all .5s var(--ease); display:none }
    #result.show{ display:block; opacity:1; transform:none }
    .result-head{ display:flex; align-items:center; gap:14px; padding:20px 0 }
    .result-icon{ width:46px; height:46px; border-radius:50%; flex:0 0 auto;
      display:grid; place-items:center }
    .result-icon svg{ width:24px; height:24px }
    .result-icon.good{ background:var(--good-soft); color:var(--good) }
    .result-icon.warn{ background:var(--warn-soft); color:var(--warn) }
    .result-icon.neutral{ background:var(--panel-2); color:var(--dim) }
    .result-title{ font-size:17px; font-weight:600 }
    .result-title small{ display:block; font-size:13px; font-weight:400; color:var(--dim); margin-top:2px }

    .diag{ padding:16px 0; border-top:1px solid var(--line) }
    .diag-title{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
      color:var(--dim); margin-bottom:12px }
    .chips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center }
    .chip{ font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:999px }
    .chip.reason{ background:var(--accent); color:var(--on-accent) }
    .chip.cover{ background:var(--panel-2); color:var(--ink) }
    .chip-arrow{ color:var(--dim); font-size:13px }
    .meta{ margin-top:14px; font-size:13px; line-height:1.6; color:var(--dim) }
    .meta b{ color:var(--ink); font-weight:600 }
    .evidence{ margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--panel-2);
      font-size:13px; line-height:1.55; color:var(--ink) }
    code{ background:var(--panel-2); padding:2px 7px; border-radius:6px; font-size:12.5px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6a3 3 0 0 0 2.5 2L22 12l-5.6 1.9a3 3 0 0 0-2 2.5L12 22l-1.9-5.6a3 3 0 0 0-2.5-2L2 12l5.6-1.9a3 3 0 0 0 2-2.5L12 2z"/></svg></div>
      <div class="brand-name">Offboard</div>
      <div class="brand-tag">live demo</div>
    </div>

    <h1>Account &amp; Billing</h1>
    <p class="sub">A mock billing page. Pick a product and a churner, then hit
      <b>Cancel subscription</b> to run the exit interview against your local engine.</p>

    <div style="margin-bottom:20px">
      <div class="seg" id="product-seg">
        <button data-product="acme" class="on">Acme Analytics</button>
        <button data-product="zen">Zen</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div class="row-label">Plan</div>
          <div class="row-value" id="acct-name">Acme Analytics</div>
        </div>
        <div class="row-value plan-price" id="acct-plan">Growth · $199/mo</div>
      </div>
      <div class="row" style="display:block">
        <label class="field-label" for="scenario">Simulate this user
          <span style="opacity:.7">— their behavioral data is sent to the engine</span></label>
        <div class="select">
          <select id="scenario"></select>
        </div>
        <div class="note">
          <span class="note-tag">Engine sees</span>
          <span id="scenario-note"></span>
        </div>
      </div>
      <div class="cancel-row">
        <div>
          <div class="row-value">Cancel subscription</div>
          <div class="row-label" style="margin-top:2px">You'll be asked a couple of questions first.</div>
        </div>
        <button class="cancel-btn" id="cancel-btn">Cancel subscription</button>
      </div>
    </div>

    <div class="card" id="result">
      <div class="result-head">
        <div class="result-icon" id="r-icon"></div>
        <div class="result-title" id="r-title"></div>
      </div>
      <div id="r-body"></div>
    </div>
  </div>

  <script type="module">
    import Offboard from "../sdk/dist/index.js";

    const API_BASE = "http://localhost:8000";

    const ICONS = {
      good: '<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      wave: '<svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 1 0-12 0v3a6 6 0 0 0 6 6M12 22a6 6 0 0 0 6-6M6 11l-2 2M18 11l2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      exit: '<svg viewBox="0 0 24 24" fill="none"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    };

    // Preset users per product. `context` is the behavioral tell the engine sees.
    const PRODUCTS = {
      acme: {
        name: "Acme Analytics", plan: "Growth · $199/mo", key: "pk_demo_acme",
        scenarios: [
          { id: "acme_never", label: "Signed up, never got going",
            note: "Never connected a data source, 2 logins in 60 days. Try opening with “too expensive.”",
            context: { plan:"Starter", mrr:49, tenure_days:61, logins_last_30d:1, activated:false,
              usage_summary:"Signed up 61 days ago. Never connected a data source. 2 logins total, none in 3 weeks." } },
          { id: "acme_price", label: "Daily power user, watching cost",
            note: "Daily active 7 months, constantly hitting the plan's event cap. Try “too expensive.”",
            context: { plan:"Starter", mrr:49, tenure_days:210, logins_last_30d:27, activated:true,
              usage_summary:"Daily active for 7 months, 3 sources connected, constantly hitting the Starter 10k-event cap." } },
          { id: "acme_ended", label: "Project wrapped up",
            note: "Heavy use then a cliff to zero 3 weeks ago. Try “not using it anymore.”",
            context: { plan:"Growth", mrr:199, tenure_days:320, logins_last_30d:1, activated:true,
              usage_summary:"Heavy daily use for months, then a sharp cliff to near-zero 3 weeks ago." } },
        ],
      },
      zen: {
        name: "Zen", plan: "Annual · $69.99/yr", key: "pk_demo_zen",
        scenarios: [
          { id: "zen_habit", label: "Never built the habit",
            note: "1 session ever, hasn't opened it in weeks. Try “too expensive.”",
            context: { plan:"Annual", mrr:5.83, tenure_days:45, logins_last_30d:0, activated:false,
              usage_summary:"Signed up 6 weeks ago in a motivated moment, completed 1 session, hasn't opened it since." } },
          { id: "zen_price", label: "Regular meditator, price-sensitive",
            note: "Meditates most mornings for months. Try “it’s gotten too pricey.”",
            context: { plan:"Annual", mrr:5.83, tenure_days:200, logins_last_30d:22, activated:true,
              usage_summary:"Meditates most mornings for months; recently said the annual price is a stretch." } },
          { id: "zen_goal", label: "Sleeping fine now",
            note: "Nightly use for two months, now rarely opens it. Try “not using it.”",
            context: { plan:"Annual", mrr:5.83, tenure_days:300, logins_last_30d:2, activated:true,
              usage_summary:"Used it nightly for sleep for two months, now sleeping fine and rarely opens it." } },
        ],
      },
    };

    let currentProduct = "acme";
    const $ = (id) => document.getElementById(id);

    function renderProduct() {
      const p = PRODUCTS[currentProduct];
      $("acct-name").textContent = p.name;
      $("acct-plan").textContent = p.plan;
      $("scenario").innerHTML = p.scenarios
        .map((s, i) => `<option value="${i}">${s.label}</option>`).join("");
      updateNote();
      $("result").classList.remove("show");
      Offboard.init({ publicKey: p.key, apiBaseUrl: API_BASE });
    }

    function updateNote() {
      const p = PRODUCTS[currentProduct];
      $("scenario-note").textContent = p.scenarios[+$("scenario").value].note;
    }

    $("product-seg").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-product]");
      if (!btn) return;
      currentProduct = btn.dataset.product;
      [...$("product-seg").children].forEach((b) => b.classList.toggle("on", b === btn));
      renderProduct();
    });
    $("scenario").addEventListener("change", updateNote);

    $("cancel-btn").addEventListener("click", () => {
      const p = PRODUCTS[currentProduct];
      const s = p.scenarios[+$("scenario").value];
      $("result").classList.remove("show");
      Offboard.showCancelFlow({
        userId: s.id,
        context: s.context,
        // Make the widget look like THIS app: inherit the page's shadcn tokens (colours +
        // radius, light and dark). Point theme.accent at a brand colour to tint the CTAs.
        theme: { adoptHostTokens: true },
        // The modal owns the conversation AND the offer. The host just reacts to the
        // terminal action: the user stayed (accepted) or left (declined / escape hatch).
        onAccept: (o) => renderStayed(o),
        onCancel: (o) => renderCancelled(o),
      });
    });

    function showResult(icon, tone, title, subtitle, bodyHtml) {
      $("r-icon").className = `result-icon ${tone}`;
      $("r-icon").innerHTML = ICONS[icon];
      $("r-title").innerHTML = `${title}<small>${subtitle}</small>`;
      $("r-body").innerHTML = bodyHtml || "";
      $("result").classList.add("show");
      $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function diagnosisHtml(o) {
      const conf = Math.round((o.confidence ?? 0) * 100);
      return `
        <div class="diag">
          <div class="diag-title">What we learned</div>
          <div class="chips">
            <span class="chip cover">“${escapeHtml(o.cover_story)}”</span>
            <span class="chip-arrow">→ really</span>
            <span class="chip reason">${escapeHtml(o.reason)}</span>
          </div>
          <div class="meta"><b>${conf}%</b> confidence · <b>${o.turns_used}</b> turns ·
            ${o.savable ? "flagged <b>savable</b>" : "<b>not</b> savable"}</div>
          <div class="evidence">${escapeHtml(o.evidence)}</div>
        </div>`;
    }

    function renderStayed(o) {
      const desc = o.intervention ? escapeHtml(o.intervention.description) : "the offer";
      showResult("good", "good", "Subscription kept 🎉",
        "The user accepted the in-chat offer.",
        `<div class="diag" style="border-top:0"><div class="meta">They accepted:
          <b>${desc}</b>. Apply it via <code>onAccept</code> — e.g. call Stripe with
          <code>intervention.id</code>.</div></div>` + diagnosisHtml(o));
    }

    function renderCancelled(o) {
      if (!o) {
        showResult("exit", "neutral", "Cancelled cleanly",
          "The user tapped the escape hatch.",
          `<div class="diag" style="border-top:0"><div class="meta">No diagnosis, no offer —
            <code>Just cancel</code> was honored immediately.</div></div>`);
        return;
      }
      const sub = o.intervention ? "They declined the offer and left." : "No offer was authorized.";
      showResult("wave", "warn", "Subscription cancelled", sub, diagnosisHtml(o));
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"]/g, (c) =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    }

    renderProduct();
  </script>
</body>
</html>
