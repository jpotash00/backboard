<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  html,body{margin:0;height:100%;background:#e9e9ee}
  /* a faint mock host page behind the sheet */
  .host{padding:40px;font-family:-apple-system,sans-serif;color:#333}
  .host h1{font-size:26px}
</style></head>
<body>
<div class="host"><h1>Account &amp; Billing</h1><p>mock host page behind the sheet…</p></div>
<script type="module">
  import { CancelFlowModal } from "/sdk/dist/ui.js";

  const params = new URLSearchParams(location.search);
  const state = params.get("state") || "offer"; // convo | offer | accept

  const OUTCOME = {
    reason: "never_activated", confidence: 0.82,
    evidence: "Never connected a data source in 61 days; the price objection is a proxy for not having gotten value yet.",
    cover_story: "too_expensive", savable: true, turns_used: 3,
    rationale: "You mentioned price, but you haven't connected a data source yet — this gets you set up free while you find your footing.",
    intervention: { id: "int_onboard", type: "concierge_onboarding",
      description: "50% off for 3 months + a free setup call" },
  };

  // Fake client that duck-types SessionClient (open/turn).
  const fakeClient = {
    async open() { await wait(500); return { session_id: "sess_demo", message:
      "Hey — before you cancel, mind if I ask one quick thing? What made Acme not click for you?" }; },
    async turn() {
      await wait(650);
      if (state === "convo") {
        return { message: "Totally fair. Was it more the price, or that you never quite got it set up?", done: false };
      }
      return { message: "Got it — thanks for being straight with me.", done: true,
        outcome: OUTCOME, intervention: OUTCOME.intervention };
    },
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const opts = {
    userId: "demo",
    onAccept: () => {}, onCancel: () => {}, onResolved: () => {},
  };
  const modal = new CancelFlowModal(fakeClient, opts);
  await modal.open();

  // Drive to the requested state via the real DOM so we screenshot the real thing.
  async function type(text) {
    const input = document.querySelector(".offboard-input");
    input.value = text; input.dispatchEvent(new Event("input"));
    document.querySelector(".offboard-send").click();
    await wait(900);
  }
  if (state !== "greeting") {
    await type("Honestly it just felt too expensive.");
  }
  if (state === "accept") {
    await wait(400);
    document.querySelector(".offboard-btn-primary")?.click();
    await wait(500);
  }
  window.__ready = true;
</script>
</body></html>
