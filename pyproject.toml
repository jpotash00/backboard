[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offboard"
version = "0.1.0"
description = "AI exit interview that diagnoses the real churn reason inside the cancel flow, then lets deterministic policy authorize the right intervention."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[project.scripts]
offboard-eval = "eval.run_eval:main"
offboard-api = "api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["engine", "eval", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
